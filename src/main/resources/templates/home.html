<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"

<head>
<meta charset="UTF-8" />
<title>Home Page</title>
</head>
<body>

<section>
	<div id="successMessageContainer">
		<div th:if="${loginn}" class="alert alert-success mt-3" role="alert">
			<span th:text="${loginn}"></span>

	</div>
	
        <div class="banner">

            <a th:href="@{/contact/about}" class="btn btn-custom-teal">Get Started</a>
        </div>
    </section>

</body>
</html>
