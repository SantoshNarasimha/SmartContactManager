<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8" />
    <title>Login Page</title>
</head>
<body>
    <section>
        <div class="banner">
            <div class="container">
                <div class="row justify-content-center align-items-center">
                    <div class="col-md-6 col-lg-5">
                        
                        <div class="text-center text-white mb-4">
                            <h1 class="display-4 font-weight-bold">Smart Contact Manager</h1>
                            <p>Start collecting your contacts in a smarter way</p>
                        </div>

                        <div id="login-box">
                            <form id="login-form" th:action="@{/contact/signin}" method="post">
                                
                                <div th:if="${param.error}" class="alert alert-danger">
                                    Invalid Username/Password
                                </div>

                                <div th:if="${param.logout}" class="alert alert-success">
                                    You have been logged out
                                </div>
                                
                                <h3 class="text-center custom-teal-text mb-4">Login</h3>
                                
                                <div class="form-group mb-3">
                                    <label for="username" class="custom-teal-text">Username:</label>
                                    <input type="text" name="username" id="username" class="form-control" required>
                                </div>
                                
                                <div class="form-group mb-3">
                                    <label for="password" class="custom-teal-text">Password:</label>
                                    <input type="password" name="password" id="password" class="form-control" required>
                                </div>
                                
                                <div class="form-group d-flex justify-content-between align-items-center mb-3">
                                    <label class="custom-teal-text mb-0">
                                        <input id="remember-me" name="remember-me" type="checkbox"> 
                                        <span>Remember me</span>
                                    </label>
                                    <button type="submit" class="btn btn-custom-teal px-4">Submit</button>
                                </div>

                                <div id="register-link" class="text-center">
                                    <a th:href="@{/contact/signup}" class="custom-teal-text">Register here</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
