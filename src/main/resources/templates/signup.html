<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8" />
<title th:text="${title}"></title>
</head>
<body>

	<section>
		<div id="registration-content" class="container-fluid">

			<div class="row">
				<div class="col-md-8 offset-md-2 col-12">

					<div class="card my-card mt-3">

						<div th:if="${errorMessage}" class="alert alert-danger"
							role="alert">
							<span th:text="${errorMessage}"></span>
						</div>


						<div class="card-header text-center pt-3">
							<div class="container text-alogn:center">
								<img th:src="@{/image/register.png}" style="width: 80px;" />
							</div>

							<h1 class="text-center">Register Here !!</h1>
						</div>

						<div class="card-body">

							<form action="#" th:action="@{/contact/do_register}"
								method="post" th:object="${user}">

								<div class="mb-3">
									<label for="name_field" class="form-label">Your Name</label> <input
										type="text" th:field="*{name}" class="form-control"
										th:classappend="${#fields.hasErrors('name') ? 'is-invalid' : ''}"
										id="name_field" placeholder="Enter here" />

									<div class="invalid-feedback"
										th:each="e : ${#fields.errors('name')}" th:text="${e}">
									</div>


								</div>

								<div class="mb-3">
									<label for="email_field" class="form-label">Your Email</label>
									<input type="email" th:field="*{email}" class="form-control"
										id="email_field" placeholder="Enter here" name="email"
										required />
								</div>

								<div class="mb-3">
									<label for="password_field" class="form-label">Your
										Password</label> <input type="password" th:field="*{password}"
										class="form-control" 
										th:classappend="${#fields.hasErrors('password')} ? 'is-invalid': '' "
										id="password_field"
										placeholder="Enter here" name="password" required />
										
										<div class="invalid-feedback" th:each="e: ${#fields.errors('password')}" th:text="${e}">
										
										</div>
										
								</div>

								<div class="mb-3">
									<label for="about_field" class="form-label">Enter
										something yourself</label>
									<textarea class="form-control"
									th:classappend="${#fields.hasErrors('about')} ? 'is-invalid' : ' ' "
									 th:field="*{about}"
										id="about_field" rows="5"
										placeholder="Enter something about yourself" name="about"></textarea>
									
									<div class= "invalid-feedback" th:each="e: ${#fields.errors('about')}" th:text="${e}">
									
									</div>
									<!-- 
									
									Validation error message
									<p class="text-danger" th:if="${#fields.hasErrors('about')}"
										th:errors="*{about}"></p>
										
										 -->
										
								</div>

								<div class="mb-3 form-check">
									<input type="checkbox" class="form-check-input" id="agreement"
										name="agreement" /> <label class="form-check-label"
										for="agreement"> I agree to the terms and conditions </label>
								</div>

								<div class="container">
									<div class="d-grid gap-2">
										<button type="submit"
											class="btn bg-primary btn-block text-white">Submit</button>
										<button type="reset" class="btn btn-warning btn-block">
											Reset</button>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

</body>
</html>
