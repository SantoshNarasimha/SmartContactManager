<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:fragment="layout(content)">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Contact Manager</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" th:href="@{/css/basics.css}">
</head>
<body>

	<nav class="fixed-top navbar navbar-expand-lg navbar-dark bg-primary">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">Smart Contact Manager</a>

			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a th:href="@{/user/home}" class="nav-link active">Home</a></li>
					 <li class="nav-item"><a class="nav-link"> <span
							th:text="${user.name}"> </span></a></li>  
					<li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<!--  Side bar -->

	<div class="sidebar ">

		<span onclick="toggleSidebar()" class="crossBtn">&times;</span> 
		<a
			href="#" th:href="@{/user/home}" class="item"><i class="fa-solid fa-house"></i>Home</a>
			 <a
			href="#" th:href="@{/user/show_contacts/0}" class="item"><i class="fa-solid fa-address-book"></i>View
			Contacts</a>
			 <a href="#" th:href="@{/user/add_contacts}"  class="item"><i class="fa-solid fa-pen"></i>Add
			Contact</a>
			 <a href="#" class="item"><i
			class="fa-solid fa-address-card"></i>Your Profile</a> 
			<a href="#"
			class="item"><i class="fa-solid fa-screwdriver-wrench"></i>Settings</a>
		<a href="#" th:href="@{/logout}" class="item"><i
			class="fa-duotone fa-solid fa-arrow-right-from-bracket"></i>Logout</a>

		<div class="divider"></div>

	</div>


	<!--  END Side Bar -->

	<!--  Content Area -->

	<div class="content">

		<i onclick="toggleSidebar()" class="ok fa-solid fa-bars"></i>

		<div th:replace="${content}"></div>

	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/javascript/script.js}"></script>
	
</body>
</html>
