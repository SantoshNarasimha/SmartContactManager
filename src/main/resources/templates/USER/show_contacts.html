<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="USER/base::layout(~{::section})">
<head>
<meta charset="UTF-8" />
<title>Home Page</title>
</head>
<body>

	<section>

		<div class="card mr-3">

			<div class="mt-3 mb-3 text-center">

				<h3> Your Contacts </h3>

			</div>

		<!-- Search Tab -->

		<div  class="search-container my-3">

			<input onkeyup="search()" id="search-input" class="form-control" type="text">

				<div class="search-result">

					<!-- Result goes here -->

				</div>

			</input>


		</div>
	
		<table class="table">
		
			<thead>
	
				<tr>
	
					<th scope="col">SCM<span th:text="${#dates.year(#dates.createNow())}"></span> </th>
					<th scope="col">Name</th>
					<th scope="col">Email</th>
					<th scope="col">Phone</th>
					<th scope="col">Action</th>
	
				</tr>
	
			</thead>
	
			<tbody>

				<tr th:each="c :${contact}" >
	
					<th scope="row"> <span th:text = "${c.cid}"></span></th>
					<td>
				
					<img src = "" th:src="@{ '/image/' + ${c.Image} }" alt= "" height = 30px; /> <span th:text = "${c.name}">
				
					</span>
				
					</td>
				
					<td><span th:text = "${c.email}"></span></td>
				
					<td><span th:text = "${c.phone}"></span></td>
				
					<td>
					
					<a href = "#" th:href = "@{/user/show_details/} + ${c.cid}"> View</a> / 
					<a href = "#"> Update</a> / 
					<a href = "#" th:href= "@{'/user/delete/' + ${c.cid}}"> Delete</a>
					
					</td>
	
				</tr>
	
			</tbody>
	
		</table>
	
		<nav aria-label="Page navigation example">

			<ul class="pagination">

				<li th:classappend="${current_page == 0} ? 'disabled' ">
				
				<a class="page-link" href="#"
				
					aria-label="Previous"
					
					 th:href="@{|/user/show_contacts/${current_page - 1}|}"
					 
					> <span aria-hidden="true">&laquo;</span>

				</a></li>

				<li  class="page-item" th:each = "i : ${#numbers.sequence(1, total_pages-1)}">
				
				<a class="page-link" href="#"  th:href="@{|/user/show_contacts/${i}|}">
				
				<span th:text = "${i}"></span></a>
				
				</li>

				<li class="page-item" th:classappend = "${current_page > total_pages-2} ? 'disabled'">
				
					<a class="page-link" href="#" 
							
					th:href="@{|/user/show_contacts/${current_page + 1}|}"
					
					aria-label="Next"> <span aria-hidden="true">&raquo;</span>

				</a></li>

			</ul>
	
		</nav>

		</div>

	</section>
	
</body>

</html>
