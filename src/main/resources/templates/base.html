<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Contact Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/basics.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Smart Contact Manager</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a th:href="@{/contact/home}" class="nav-link active">Home</a></li>
                    <li class="nav-item"><a th:href="@{/contact/about}" class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contact/signin}">Login</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contact/signup}">SignUp</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show m-0" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="main-content">
        <div th:replace="${content}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/javascript/script.js}"></script>
</body>
</html>
